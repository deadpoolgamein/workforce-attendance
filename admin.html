<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIP Smart Attendance Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 flex flex-col items-center justify-center font-sans overflow-x-hidden">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-4 sm:p-5 overflow-hidden">
    
    <!-- Header -->
    <div class="flex items-start justify-between gap-2 border-b border-slate-800 pb-3 mb-4">
      <div class="min-w-0 flex-1">
        <span class="inline-block text-[9px] tracking-widest uppercase bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-800 font-mono font-bold">
          ⚡ SMART TIME-SLOT ACTIVE
        </span>
        <h1 class="text-base sm:text-lg font-black text-white mt-1 leading-tight">PRIVATE ATTENDANCE PORTAL</h1>
      </div>
      <div class="text-right text-[10px] font-mono text-slate-400 shrink-0 leading-snug">
        <div>IN: 08:40 - 08:59 AM</div>
        <div>OUT: 05:15 - 05:32 PM</div>
      </div>
    </div>

    <!-- Employee ID -->
    <div class="mb-3 text-xs">
      <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">EMPLOYEE ID</label>
      <input type="text" id="empId" value="J-5383" placeholder="Enter Emp ID" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-mono uppercase text-sm focus:outline-none focus:border-indigo-500">
    </div>

    <!-- Duty Action & Shift -->
    <div class="grid grid-cols-2 gap-2 text-xs mb-4">
      <div class="min-w-0">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">DUTY ACTION</label>
        <select id="dutyType" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2.5 text-emerald-400 font-bold text-xs truncate focus:outline-none focus:border-indigo-500">
          <option value="ON-DUTY">🟢 ON-DUTY (8:40-8:59)</option>
          <option value="OFF-DUTY">🔴 OFF-DUTY (5:15-5:32)</option>
        </select>
      </div>
      <div class="min-w-0">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">SHIFT</label>
        <select id="shift" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2.5 text-slate-200 text-xs truncate focus:outline-none focus:border-indigo-500">
          <option value="General">General (9AM-6PM)</option>
          <option value="Morning">Morning (6AM-2PM)</option>
          <option value="Afternoon">Afternoon (2PM-10PM)</option>
          <option value="Night">Night (10PM-6AM)</option>
        </select>
      </div>
    </div>

    <!-- QR Scanner Box -->
    <div id="qrBox" class="hidden mb-4 bg-slate-950 border border-slate-800 rounded-xl overflow-hidden p-2">
      <div id="reader" class="w-full rounded-lg overflow-hidden"></div>
      <button onclick="stopQrScanner()" class="w-full mt-2 py-2 bg-rose-600 text-white font-bold text-xs rounded-lg">Cancel QR Scan</button>
    </div>

    <!-- Live Front Camera Box -->
    <div id="cameraBox" class="hidden mb-4 bg-slate-950 border border-indigo-700 rounded-xl p-3 text-center">
      <p id="countdownText" class="text-xs font-mono text-indigo-400 font-bold mb-2">Position Face for Verification...</p>
      <video id="video" autoplay playsinline class="w-full h-56 object-cover rounded-lg border border-slate-800 bg-black"></video>
      <canvas id="canvas" class="hidden"></canvas>
    </div>

    <!-- Main Scan Button -->
    <div id="actionButtons" class="space-y-3">
      <button onclick="startVipQrFlow()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs rounded-xl shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
        <span>📷</span> SCAN LOCATION QR CODE
      </button>

      <!-- Direct Location Punch (Fixed Responsive Layout with min-w-0 & truncate) -->
      <div class="pt-2 border-t border-slate-800/80">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[10px] font-bold text-slate-400 uppercase">OR DIRECT LOCATION PUNCH:</span>
          <span id="locSyncBadge" class="text-[10px] font-mono text-emerald-400">Syncing...</span>
        </div>

        <div class="flex items-center gap-2 w-full">
          <select id="directLocationSelect" class="flex-1 min-w-0 w-0 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white text-xs font-medium truncate focus:outline-none focus:border-emerald-500">
            <option value="CGC_LOC_WORKSHOP_1">Workshop (CGC_LOC_WORKSHOP_1)</option>
          </select>
          <button onclick="startDirectLocationPunch()" class="shrink-0 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow transition active:scale-95">
            Punch
          </button>
        </div>
      </div>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="hidden mt-4 p-3 rounded-xl border text-xs font-mono text-center"></div>

    <!-- WhatsApp Post Options -->
    <div id="whatsappShareBox" class="hidden mt-3 p-3.5 bg-emerald-950/40 border border-emerald-700/80 rounded-xl space-y-2">
      <p class="text-[11px] text-emerald-300 font-bold text-center uppercase tracking-wider">📢 Post Attendance to WhatsApp Group</p>
      <button onclick="sharePunchWithPhoto()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
        <span>📲</span> POST TO WHATSAPP (WITH PHOTO)
      </button>
      <button onclick="sharePunchTextOnly()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold text-[11px] rounded-xl flex items-center justify-center gap-1.5 transition active:scale-95">
        <span>💬</span> Post Text Slip Only
      </button>
    </div>

    <!-- Footer -->
    <div class="mt-4 pt-3 text-center border-t border-slate-800">
      <p class="text-[10px] text-slate-500 uppercase font-mono tracking-wider">System Architect: Sandeep Singh</p>
    </div>
  </div>

  <script>
    // ========================================================
    // CONFIGURE YOUR APPS SCRIPT WEB APP URL HERE:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGJ3AtVNlP-TWLbRgxbqbmTEuQOCT4D-Wj2V65CZ6X7GSo7bNoqKvM683q5ccJk8TufQ/exec";
    // ========================================================

    let html5QrCode = null;
    let scannedSecret = "";
    let userLat = 30.7499;
    let userLng = 76.6432;
    let lastCapturedPhoto = "";
    let lastWhatsAppMessage = "";

    function refreshGps() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
          },
          err => {},
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }
    }
    refreshGps();

    async function loadLiveConfig() {
      const locSel = document.getElementById('directLocationSelect');
      const shiftSel = document.getElementById('shift');
      const badge = document.getElementById('locSyncBadge');

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "GET_PORTAL_CONFIG" })
        });
        const data = await res.json();

        if (data.status === "success") {
          if (data.locations && data.locations.length > 0) {
            locSel.innerHTML = "";
            data.locations.forEach(loc => {
              const opt = document.createElement('option');
              opt.value = loc.qrSecret;
              opt.textContent = `${loc.name} (${loc.qrSecret})`;
              locSel.appendChild(opt);
            });
          }

          if (data.shifts && data.shifts.length > 0) {
            shiftSel.innerHTML = "";
            data.shifts.forEach(s => {
              const opt = document.createElement('option');
              opt.value = s.name;
              opt.textContent = s.label;
              shiftSel.appendChild(opt);
            });
          }

          const locCount = (data.locations && data.locations.length) || 4;
          badge.innerText = `✔ ${locCount} Locations & Shifts Synced`;
        }
      } catch (e) {
        badge.innerText = "Default Config";
      }
    }

    window.addEventListener("DOMContentLoaded", loadLiveConfig);

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden');
      if (type === "loading") {
        box.className = "mt-4 p-3 rounded-xl border border-yellow-700 bg-yellow-950/40 text-yellow-300 text-xs font-mono text-center";
      } else if (type === "success") {
        box.className = "mt-4 p-3 rounded-xl border border-emerald-700 bg-emerald-950/50 text-emerald-300 text-xs font-mono text-center";
      } else {
        box.className = "mt-4 p-3 rounded-xl border border-rose-700 bg-rose-950/50 text-rose-300 text-xs font-mono text-center";
      }
      box.innerHTML = msg;
    }

    function startVipQrFlow() {
      const empId = document.getElementById('empId').value.trim();
      if (!empId) {
        alert("Employee ID enter karein!");
        return;
      }
      refreshGps();
      document.getElementById('qrBox').classList.remove('hidden');
      document.getElementById('actionButtons').classList.add('hidden');
      document.getElementById('statusBox').classList.add('hidden');
      document.getElementById('whatsappShareBox').classList.add('hidden');

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          scannedSecret = decodedText.trim();
          stopQrScanner();
          startSelfieCapture();
        },
        (err) => {}
      ).catch(err => {
        alert("Camera error: " + err);
        stopQrScanner();
      });
    }

    function stopQrScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('qrBox').classList.add('hidden');
          document.getElementById('actionButtons').classList.remove('hidden');
        }).catch(() => {});
      } else {
        document.getElementById('qrBox').classList.add('hidden');
        document.getElementById('actionButtons').classList.remove('hidden');
      }
    }

    function startDirectLocationPunch() {
      const empId = document.getElementById('empId').value.trim();
      if (!empId) {
        alert("Employee ID enter karein!");
        return;
      }
      refreshGps();
      scannedSecret = document.getElementById('directLocationSelect').value;
      document.getElementById('statusBox').classList.add('hidden');
      document.getElementById('whatsappShareBox').classList.add('hidden');
      startSelfieCapture();
    }

    async function startSelfieCapture() {
      const camBox = document.getElementById('cameraBox');
      const video = document.getElementById('video');
      const countText = document.getElementById('countdownText');

      document.getElementById('actionButtons').classList.add('hidden');
      camBox.classList.remove('hidden');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;

        let count = 3;
        countText.innerText = `Capturing Selfie in ${count}...`;

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            countText.innerText = `Capturing Selfie in ${count}...`;
          } else {
            clearInterval(timer);
            countText.innerText = "Saving Smart Time-Slot Punch...";

            const canvas = document.getElementById('canvas');
            canvas.width = 400;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Photo = canvas.toDataURL('image/jpeg', 0.65);
            lastCapturedPhoto = base64Photo;

            stream.getTracks().forEach(track => track.stop());
            camBox.classList.add('hidden');
            submitVipPunch(base64Photo);
          }
        }, 1000);
      } catch (err) {
        alert("Front camera permission zaroori hai: " + err.message);
        camBox.classList.add('hidden');
        document.getElementById('actionButtons').classList.remove('hidden');
      }
    }

    async function submitVipPunch(photoData) {
      const empId = document.getElementById('empId').value.trim().toUpperCase();
      const dutyType = document.getElementById('dutyType').value;
      const shift = document.getElementById('shift').value;

      showStatus("⏳ Recording Smart Attendance...", "loading");

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            empId: empId,
            dutyType: dutyType,
            shift: shift,
            punchMode: "QR",
            scannedQr: scannedSecret,
            latitude: userLat,
            longitude: userLng,
            photo: photoData,
            randomTimeMode: true
          })
        });

        const data = await res.json();
        document.getElementById('actionButtons').classList.remove('hidden');

        if (data.status === "success") {
          const todayStr = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
          const badgeIcon = data.dutyType === "ON-DUTY" ? "🟢" : "🔴";

          lastWhatsAppMessage =
            `${badgeIcon} *CGC MAINTENANCE ATTENDANCE*\n` +
            `━━━━━━━━━━━━━━━━━━━━\n` +
            `👤 *Name:* ${data.name}\n` +
            `🆔 *Emp ID:* ${empId}\n` +
            `🛠 *Sub-Dept:* ${data.trade}\n` +
            `📌 *Duty:* ${data.dutyType} (${shift})\n` +
            `📍 *Location:* ${data.locationName}\n` +
            `📅 *Day Type:* ${data.dayCategory}\n` +
            `🕒 *Time:* ${data.time}\n` +
            `📆 *Date:* ${todayStr}\n` +
            `✅ *Status:* ${data.punctuality}\n` +
            `━━━━━━━━━━━━━━━━━━━━\n` +
            `_Verified via Digital Workforce Portal_`;

          showStatus(
            `✅ <b>ATTENDANCE MARKED!</b><br>` +
            `👤 ${data.name} (${data.trade})<br>` +
            `📍 Location: <b>${data.locationName}</b><br>` +
            `🕒 Smart Time: <b>${data.time}</b> | <b>${data.punctuality}</b>`,
            "success"
          );

          document.getElementById('whatsappShareBox').classList.remove('hidden');
        } else {
          showStatus(`❌ ${data.message}`, "error");
        }
      } catch (err) {
        document.getElementById('actionButtons').classList.remove('hidden');
        showStatus("❌ Network Error! Internet check karein.", "error");
      }
    }

    async function sharePunchWithPhoto() {
      if (!lastWhatsAppMessage) return;
      try {
        if (lastCapturedPhoto && navigator.canShare) {
          const res = await fetch(lastCapturedPhoto);
          const blob = await res.blob();
          const file = new File([blob], "Attendance_Selfie.jpg", { type: "image/jpeg" });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              text: lastWhatsAppMessage
            });
            return;
          }
        }
      } catch (e) {}
      sharePunchTextOnly();
    }

    function sharePunchTextOnly() {
      if (!lastWhatsAppMessage) return;
      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(lastWhatsAppMessage)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
