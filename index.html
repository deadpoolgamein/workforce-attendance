<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGC Workforce Attendance</title>

  <!-- PWA App Install Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-5">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
      <div>
        <span class="text-[10px] tracking-widest uppercase bg-emerald-950 text-emerald-400 px-2.5 py-0.5 rounded-full border border-emerald-800 font-mono font-bold">
          📍 150m Geofence Active
        </span>
        <h1 class="text-lg font-black text-white mt-1">CGC WORKFORCE PORTAL</h1>
        <p class="text-[11px] text-slate-400">Department of Maintenance Services</p>
      </div>
      <a href="./admin.html" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700 font-mono">
        Admin 🔒
      </a>
    </div>

    <!-- Form Inputs -->
    <div class="space-y-3 text-xs mb-4">
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Employee ID</label>
        <input type="text" id="empId" placeholder="Enter Emp ID (e.g. MEC-W01)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-mono uppercase text-sm focus:outline-none focus:border-emerald-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Duty Action</label>
          <select id="dutyType" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-emerald-400 font-bold focus:outline-none focus:border-emerald-500">
            <option value="ON-DUTY">🟢 ON-DUTY (In)</option>
            <option value="OFF-DUTY">🔴 OFF-DUTY (Out)</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Shift</label>
          <select id="shift" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
            <option value="General">General (9AM-6PM)</option>
            <option value="Morning">Morning (6AM-2PM)</option>
            <option value="Afternoon">Afternoon (2PM-10PM)</option>
            <option value="Night">Night (10PM-6AM)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- QR Scanner Box -->
    <div id="qrBox" class="hidden mb-4 bg-slate-950 border border-slate-800 rounded-xl overflow-hidden p-2">
      <div id="reader" class="w-full rounded-lg overflow-hidden"></div>
      <button onclick="stopQrScanner()" class="w-full mt-2 py-2 bg-rose-600 text-white font-bold text-xs rounded-lg">Cancel QR Scan</button>
    </div>

    <!-- Live Front Camera Box for Selfie -->
    <div id="cameraBox" class="hidden mb-4 bg-slate-950 border border-emerald-700 rounded-xl p-3 text-center">
      <p id="countdownText" class="text-xs font-mono text-emerald-400 font-bold mb-2">Position Face for Verification...</p>
      <video id="video" autoplay playsinline class="w-full h-56 object-cover rounded-lg border border-slate-800 bg-black"></video>
      <canvas id="canvas" class="hidden"></canvas>
    </div>

    <!-- Action Buttons -->
    <div id="actionButtons" class="space-y-2.5">
      <button onclick="startQrFlow()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
        <span>📷</span> SCAN GATE QR CODE
      </button>

      <button onclick="startManualFlow()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold text-xs rounded-xl flex items-center justify-center gap-2 transition active:scale-95">
        <span>📱</span> Mobile Direct Punch (If Allowed)
      </button>
    </div>

    <!-- Status Display -->
    <div id="statusBox" class="hidden mt-4 p-3 rounded-xl border text-xs font-mono text-center"></div>

    <!-- WhatsApp Post Options (Appears automatically after punch) -->
    <div id="whatsappShareBox" class="hidden mt-3 p-3.5 bg-emerald-950/40 border border-emerald-700/80 rounded-xl space-y-2">
      <p class="text-[11px] text-emerald-300 font-bold text-center uppercase tracking-wider">📢 Post Attendance to WhatsApp Group</p>
      <button onclick="sharePunchWithPhoto()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
        <span>📲</span> POST TO WHATSAPP (WITH PHOTO)
      </button>
      <button onclick="sharePunchTextOnly()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold text-[11px] rounded-xl flex items-center justify-center gap-1.5 transition active:scale-95">
        <span>💬</span> Post Text Slip Only
      </button>
    </div>

    <!-- Footer -->
    <div class="mt-5 pt-3 text-center border-t border-slate-800">
      <p class="text-[10px] text-slate-500 uppercase font-mono">Developed & Managed by Sandeep Singh</p>
    </div>
  </div>

  <script>
    // ==========================================
    // PASTE YOUR APPS SCRIPT WEB APP URL HERE:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGJ3AtVNlP-TWLbRgxbqbmTEuQOCT4D-Wj2V65CZ6X7GSo7bNoqKvM683q5ccJk8TufQ/exec";
    // ==========================================

    let html5QrCode = null;
    let currentPunchMode = "QR";
    let scannedSecret = "";
    let userLat = null;
    let userLng = null;
    let lastCapturedPhoto = "";
    let lastWhatsAppMessage = "";

    // Request Live GPS Location
    function refreshGpsLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
          },
          err => { console.warn("GPS Permission Needed"); },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }
    }
    refreshGpsLocation();

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden');
      if (type === "loading") {
        box.className = "mt-4 p-3 rounded-xl border border-yellow-700 bg-yellow-950/40 text-yellow-300 text-xs font-mono text-center";
      } else if (type === "success") {
        box.className = "mt-4 p-3 rounded-xl border border-emerald-700 bg-emerald-950/50 text-emerald-300 text-xs font-mono text-center";
      } else {
        box.className = "mt-4 p-3 rounded-xl border border-rose-700 bg-rose-950/50 text-rose-300 text-xs font-mono text-center";
      }
      box.innerHTML = msg;
    }

    function startQrFlow() {
      const empId = document.getElementById('empId').value.trim();
      if (!empId) {
        alert("Pehle apna Employee ID enter karein!");
        return;
      }
      refreshGpsLocation();
      currentPunchMode = "QR";

      document.getElementById('qrBox').classList.remove('hidden');
      document.getElementById('actionButtons').classList.add('hidden');
      document.getElementById('statusBox').classList.add('hidden');
      document.getElementById('whatsappShareBox').classList.add('hidden');

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          scannedSecret = decodedText.trim();
          stopQrScanner();
          startSelfieCapture();
        },
        (err) => {}
      ).catch(err => {
        alert("Back camera start nahi ho paya: " + err);
        stopQrScanner();
      });
    }

    function stopQrScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('qrBox').classList.add('hidden');
          document.getElementById('actionButtons').classList.remove('hidden');
        }).catch(() => {});
      } else {
        document.getElementById('qrBox').classList.add('hidden');
        document.getElementById('actionButtons').classList.remove('hidden');
      }
    }

    function startManualFlow() {
      const empId = document.getElementById('empId').value.trim();
      if (!empId) {
        alert("Pehle apna Employee ID enter karein!");
        return;
      }
      refreshGpsLocation();
      currentPunchMode = "MANUAL";
      scannedSecret = "";
      document.getElementById('statusBox').classList.add('hidden');
      document.getElementById('whatsappShareBox').classList.add('hidden');
      startSelfieCapture();
    }

    async function startSelfieCapture() {
      const camBox = document.getElementById('cameraBox');
      const video = document.getElementById('video');
      const countText = document.getElementById('countdownText');

      document.getElementById('actionButtons').classList.add('hidden');
      camBox.classList.remove('hidden');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;

        let count = 3;
        countText.innerText = `Capturing Live Selfie in ${count}...`;

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            countText.innerText = `Capturing Live Selfie in ${count}...`;
          } else {
            clearInterval(timer);
            countText.innerText = "Verifying Location & Saving...";

            const canvas = document.getElementById('canvas');
            canvas.width = 400;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Photo = canvas.toDataURL('image/jpeg', 0.65);
            lastCapturedPhoto = base64Photo;

            stream.getTracks().forEach(track => track.stop());
            camBox.classList.add('hidden');
            submitWorkerAttendance(base64Photo);
          }
        }, 1000);

      } catch (err) {
        alert("Front camera permission zaroori hai: " + err.message);
        camBox.classList.add('hidden');
        document.getElementById('actionButtons').classList.remove('hidden');
      }
    }

    async function submitWorkerAttendance(photoData) {
      const empId = document.getElementById('empId').value.trim().toUpperCase();
      const dutyType = document.getElementById('dutyType').value;
      const shift = document.getElementById('shift').value;

      if (userLat === null || userLng === null) {
        showStatus("❌ GPS Location ON karein aur page refresh karein!", "error");
        document.getElementById('actionButtons').classList.remove('hidden');
        return;
      }

      showStatus("⏳ Verifying Geofence & Recording Attendance...", "loading");

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            empId: empId,
            dutyType: dutyType,
            shift: shift,
            punchMode: currentPunchMode,
            scannedQr: scannedSecret,
            latitude: userLat,
            longitude: userLng,
            photo: photoData
          })
        });

        const data = await res.json();
        document.getElementById('actionButtons').classList.remove('hidden');

        if (data.status === "success") {
          const todayStr = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
          const badgeIcon = data.dutyType === "ON-DUTY" ? "🟢" : "🔴";

          lastWhatsAppMessage =
            `${badgeIcon} *CGC MAINTENANCE ATTENDANCE*\n` +
            `━━━━━━━━━━━━━━━━━━━━\n` +
            `👤 *Name:* ${data.name}\n` +
            `🆔 *Emp ID:* ${empId}\n` +
            `🛠 *Trade:* ${data.trade}\n` +
            `📌 *Duty:* ${data.dutyType} (${shift})\n` +
            `📍 *Location:* ${data.locationName}\n` +
            `🕒 *Time:* ${data.time}\n` +
            `📅 *Date:* ${todayStr}\n` +
            `✅ *Status:* ${data.punctuality}\n` +
            `━━━━━━━━━━━━━━━━━━━━\n` +
            `_Verified via Digital Workforce Portal_`;

          showStatus(
            `✅ <b>ATTENDANCE MARKED!</b><br>` +
            `👤 ${data.name} (${data.trade})<br>` +
            `📍 Location: <b>${data.locationName}</b> (${data.distance}m)<br>` +
            `🕒 Time: <b>${data.time}</b><br>` +
            `📌 Status: <b>${data.punctuality}</b>`,
            "success"
          );

          document.getElementById('whatsappShareBox').classList.remove('hidden');
        } else {
          showStatus(`❌ ${data.message}`, "error");
        }
      } catch (err) {
        document.getElementById('actionButtons').classList.remove('hidden');
        showStatus("❌ Network Error! Internet check karein.", "error");
      }
    }

    async function sharePunchWithPhoto() {
      if (!lastWhatsAppMessage) return;
      try {
        if (lastCapturedPhoto && navigator.canShare) {
          const res = await fetch(lastCapturedPhoto);
          const blob = await res.blob();
          const file = new File([blob], "Attendance_Selfie.jpg", { type: "image/jpeg" });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              text: lastWhatsAppMessage
            });
            return;
          }
        }
      } catch (e) {
        console.log("Fallback to text share");
      }
      sharePunchTextOnly();
    }

    function sharePunchTextOnly() {
      if (!lastWhatsAppMessage) return;
      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(lastWhatsAppMessage)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
